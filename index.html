<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SCT Portal Dashboard</title>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  margin: 0;
  background: #f4f6fa;
}

.header {
  background: #0b3d91;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

.container {
  padding: 30px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.card h2 {
  margin-bottom: 10px;
  color: #0b3d91;
}

.card p {
  color: #666;
  font-size: 14px;
}

.btn {
  margin-top: 15px;
  padding: 10px 20px;
  border: none;
  background: #0b3d91;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}
</style>

<script>
function openStrategic() {
  window.open("https://accsrichonlathorn-collab.github.io/SCT_Strategic_Intersection_Dashboard_new/", "_blank");
}

function openExecutive() {
  window.open("https://accsrichonlathorn-collab.github.io/SCT_Executive_Status_Board_new/", "_blank");
}
</script>

</head>

<body>

<div class="header">
SCT Portal Dashboard
</div>

<div class="container">

  <div class="card">
    <h2>📊 Strategic Dashboard</h2>
    <p>ภาพรวมกลยุทธ์</p>
    <button class="btn" onclick="openStrategic()">เปิดใช้งาน</button>
  </div>

  <div class="card">
    <h2>📈 Executive Dashboard</h2>
    <p>สถานะผู้บริหาร</p>
    <button class="btn" onclick="openExecutive()">เปิดใช้งาน</button>
  </div>

</div>

</body>
</html>
