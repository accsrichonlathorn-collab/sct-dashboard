<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SCT Portal Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6fa;
}

.header {
    background: #0b3d91;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 40px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.btn {
    margin-top: 15px;
    display: inline-block;
    padding: 10px 18px;
    background: #0b3d91;
    color: white;
    border-radius: 6px;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="header">
    SCT Portal Dashboard
</div>

<div class="container">

    <div class="card">
        <h3>📊 Strategic Dashboard</h3>
        <p>ภาพรวมกลยุทธ์</p>
        <a class="btn" href="https://accsrichonlathorn-collab.github.io/SCT_Strategic_Intersection_Dashboard_new/" target="_blank">
            เปิดใช้งาน
        </a>
    </div>


    <div class="card">
        <h3>📋 Executive Dashboard</h3>
        <p>สำหรับผู้บริหาร</p>
        <a class="btn" href="https://accsrichonlathorn-collab.github.io/SCT_Executive_Status_Board_new/" target="_blank">
            เปิดใช้งาน
        </a>
    </div>

</div>

</body>
</html>
